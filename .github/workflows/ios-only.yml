name: Build iOS (unsigned IPA)

# iOS-only leg.
#
# Upstream 1molchuan/fluxdo went Android-only in 1.0 (commit 323608c4 removed
# ios/, macos/, apple/ and the iOS-only dependencies). The iOS shell is
# therefore restored inside this job from the last upstream revision that still
# had it, and layered on top of the current 1.0 sources. Nothing is written back
# to 1molchuan/fluxdo and nothing is merged into this repo.
#
# Triggers:
#   workflow_dispatch - run by hand from the Actions tab
#   push tags v*      - kept from the original build.yaml
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # Last upstream cfluxdo revision that still carried ios/ and apple/.
  # 1molchuan/fluxdo commit 323608c4 ("仅保留 Android") deleted them.
  IOS_SHELL_SHA: 11c1fd3c975af09025be6053411d92d41bb161f2

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - name: Resolve upstream cfluxdo HEAD
        id: upstream
        run: |
          sha=$(git ls-remote https://github.com/1molchuan/fluxdo refs/heads/cfluxdo | cut -f1)
          if [ -z "$sha" ]; then
            echo "could not read refs/heads/cfluxdo from 1molchuan/fluxdo" >&2
            exit 1
          fi
          echo "upstream cfluxdo = $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # A successful build leaves a marker cache under key cfluxdo-built-<sha>.
      # An exact hit means this exact revision was already built and shipped.
      - name: Look for a previous build of this revision
        id: check
        uses: actions/cache/restore@v4
        with:
          path: .built-marker
          key: cfluxdo-built-${{ steps.upstream.outputs.sha }}

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ steps.check.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already built ${{ steps.upstream.outputs.sha }} - skipping"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new revision ${{ steps.upstream.outputs.sha }} - building"
          fi

  build-ios:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Do NOT build this repo's pristine main; take 1molchuan's cfluxdo branch,
      # which carries all of the author's changes. Full history is fetched so
      # the iOS shell can be pulled out of an older revision below.
      - name: Checkout cfluxdo (1.0 sources)
        uses: actions/checkout@v4
        with:
          repository: 1molchuan/fluxdo
          ref: cfluxdo
          submodules: recursive
          fetch-depth: 0

      - name: Show checked-out commit
        run: git log -1 --oneline

      # 1.0 removed ios/ and apple/. Restore just those two paths from the last
      # revision that had them. Working tree only - no upstream write.
      - name: Restore iOS shell from the last iOS-bearing revision
        run: |
          git checkout "$IOS_SHELL_SHA" -- ios apple
          echo "--- restored from $IOS_SHELL_SHA ---"
          ls ios/Runner | head -n 25

      # The restored shell imports workmanager_apple and registers a periodic
      # background task, but 1.0 deliberately dropped that dependency. Strip
      # both lines so the Swift target links without it. Consequence: no iOS
      # background notification polling (the app only polls while foregrounded).
      - name: Drop workmanager from the iOS shell
        run: |
          perl -ni -e 'print unless /^import workmanager_apple$/ or /WorkmanagerPlugin\.registerPeriodicTask/' ios/Runner/AppDelegate.swift
          if grep -q -i workmanager ios/Runner/AppDelegate.swift; then
            echo "workmanager references still present:" >&2
            grep -n -i workmanager ios/Runner/AppDelegate.swift >&2
            exit 1
          fi
          echo "workmanager references removed from AppDelegate.swift"

      # 1.0's pubspec dropped the SwiftPM opt-out along with the desktop
      # platforms. Flutter 3.44's generated Swift package pins the macOS
      # deployment target too low and breaks plugins such as gal, so keep the
      # CocoaPods path.
      - name: Keep Flutter on CocoaPods instead of SwiftPM
        run: |
          perl -0pi -e 's/flutter:\n  uses-material-design: true/flutter:\n  config:\n    enable-swift-package-manager: false\n  uses-material-design: true/' pubspec.yaml
          grep -n -A1 'enable-swift-package-manager' pubspec.yaml || echo "note: substitution did not apply"

      # The author renamed Android and the in-app branding to cfluxdo; the iOS
      # Info.plist still says FluxDO. Align the display name at build time.
      - name: Rename iOS app to cfluxdo
        run: |
          plutil -replace CFBundleDisplayName -string cfluxdo ios/Runner/Info.plist
          plutil -replace CFBundleName -string cfluxdo ios/Runner/Info.plist
          echo "--- after rename ---"
          plutil -p ios/Runner/Info.plist | grep -E 'CFBundleDisplayName|CFBundleName'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Upstream .fvmrc pins 3.47.7; anything older ships Dart 3.12 and
          # fails on the ^3.13.0 SDK constraint in pubspec.yaml.
          flutter-version: '3.47.7'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: ios-

      - name: Setup iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      # Route CocoaPods git access through the token to avoid anonymous limits
      - name: Configure Git for CocoaPods
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      # dart tool/flutterw.dart internally runs project_prep + native:prepare ios
      - name: Build iOS
        run: |
          dart tool/flutterw.dart build ios --release --no-codesign
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep "_doh_proxy_start_with_config_json"
          plutil -p build/ios/iphoneos/Runner.app/Info.plist | grep -E 'CFBundleDisplayName|CFBundleName|CFBundleIdentifier'
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r cfluxdo-unsigned.ipa Payload
          mv cfluxdo-unsigned.ipa ../../../dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-ios
          path: ./dist
          overwrite: true

      # Only recorded after everything above succeeded, so a failed build is
      # retried on the next scheduled run.
      - name: Mark this revision as built
        run: |
          mkdir -p .built-marker
          echo "${{ needs.check-upstream.outputs.sha }}" > .built-marker/built.txt

      - name: Save build marker
        uses: actions/cache/save@v4
        with:
          path: .built-marker
          key: cfluxdo-built-${{ needs.check-upstream.outputs.sha }}
