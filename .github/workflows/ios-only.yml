name: Build iOS (unsigned IPA)

# iOS-only leg. Pulls the author's cfluxdo branch directly; nothing is merged
# into this repo.
#
# Triggers:
#   workflow_dispatch - run by hand from the Actions tab
#   schedule          - daily check; the build is skipped entirely when
#                       1molchuan/cfluxdo has no commit newer than the last
#                       successful build
#   push tags v*      - kept from the original build.yaml
on:
  workflow_dispatch:
  schedule:
    # 20:00 UTC = 04:00 Asia/Shanghai
    - cron: '0 20 * * *'
  push:
    tags:
      - 'v*'

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - name: Resolve upstream cfluxdo HEAD
        id: upstream
        run: |
          sha=$(git ls-remote https://github.com/1molchuan/fluxdo refs/heads/cfluxdo | cut -f1)
          if [ -z "$sha" ]; then
            echo "could not read refs/heads/cfluxdo from 1molchuan/fluxdo" >&2
            exit 1
          fi
          echo "upstream cfluxdo = $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # A successful build leaves a marker cache under key cfluxdo-built-<sha>.
      # An exact hit means this exact revision was already built and shipped.
      - name: Look for a previous build of this revision
        id: check
        uses: actions/cache/restore@v4
        with:
          path: .built-marker
          key: cfluxdo-built-${{ steps.upstream.outputs.sha }}

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ steps.check.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already built ${{ steps.upstream.outputs.sha }} - skipping"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new revision ${{ steps.upstream.outputs.sha }} - building"
          fi

  build-ios:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Key step: do NOT build this repo's pristine main; take 1molchuan's
      # cfluxdo branch, which carries all 34 author changes.
      - name: Checkout cfluxdo
        uses: actions/checkout@v4
        with:
          repository: 1molchuan/fluxdo
          ref: cfluxdo
          submodules: recursive

      - name: Show checked-out commit
        run: git log -1 --oneline

      # The author only renamed Android; iOS Info.plist still says FluxDO.
      # Align the iOS display name with cfluxdo at build time.
      - name: Rename iOS app to cfluxdo
        run: |
          plutil -replace CFBundleDisplayName -string cfluxdo ios/Runner/Info.plist
          plutil -replace CFBundleName -string cfluxdo ios/Runner/Info.plist
          echo "--- after rename ---"
          plutil -p ios/Runner/Info.plist | grep -E 'CFBundleDisplayName|CFBundleName'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Same as the build job in the original file: iOS leg pins 3.44.0
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: ios-

      - name: Setup iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      # Route CocoaPods git access through the token to avoid anonymous limits
      - name: Configure Git for CocoaPods
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      # dart tool/flutterw.dart internally runs project_prep + native:prepare ios
      - name: Build iOS
        run: |
          dart tool/flutterw.dart build ios --release --no-codesign
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep "_doh_proxy_start_with_config_json"
          plutil -p build/ios/iphoneos/Runner.app/Info.plist | grep -E 'CFBundleDisplayName|CFBundleName|CFBundleIdentifier'
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r fluxdo-unsigned.ipa Payload
          mv fluxdo-unsigned.ipa ../../../dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-ios
          path: ./dist
          overwrite: true

      # Only recorded after everything above succeeded, so a failed build is
      # retried on the next scheduled run.
      - name: Mark this revision as built
        run: |
          mkdir -p .built-marker
          echo "${{ needs.check-upstream.outputs.sha }}" > .built-marker/built.txt

      - name: Save build marker
        uses: actions/cache/save@v4
        with:
          path: .built-marker
          key: cfluxdo-built-${{ needs.check-upstream.outputs.sha }}
